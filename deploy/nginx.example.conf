# Exemplo de proxy reverso com HTTPS (troque o domínio e os certificados).
# Com proxy na frente, o app deve escutar só em 127.0.0.1 (HOST padrão) e TRUST_PROXY=loopback (padrão).
server {
    listen 443 ssl http2;
    server_name financas.example.com;

    ssl_certificate     /etc/letsencrypt/live/financas.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/financas.example.com/privkey.pem;

    client_max_body_size 160m;   # até 10 arquivos de 15 MB por envio

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

server {
    listen 80;
    server_name financas.example.com;
    return 301 https://$host$request_uri;
}
